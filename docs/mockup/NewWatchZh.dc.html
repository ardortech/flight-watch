<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>新增追蹤</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#174A94}a:hover{color:#0E2F62}
</style>
</helmet>
<div style="min-height: 100vh; background: #F3F4F1; color: #14202B; font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.6">
  <header style="background: #14202B; color: #F3F4F1">
    <div style="max-width: 1200px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16l8-3 4-9 2 1-2 8 6-2 2 2-18 6z"></path><path d="M3 21h18"></path></svg>
        <span>Flight Watch</span>
        <span role="group" aria-label="語言 Language" style="margin-left: 12px; display: inline-flex; border: 1px solid #4A5B6C; border-radius: 999px; overflow: hidden; font-size: 13px; font-weight: 600"><a href="#" aria-current="true" style="padding: 6px 12px; background: #E8A33D; color: #14202B; text-decoration: none">中文</a><a href="NewWatch.dc.html" lang="en" style="padding: 6px 12px; color: #C9D1D9; text-decoration: none">EN</a></span>
      </div>
      <nav aria-label="主選單" style="display: flex; flex-wrap: wrap; gap: 4px">
        <a href="MainZh.dc.html" style="color: #C9D1D9; text-decoration: none; padding: 10px 14px; border-radius: 8px">我的追蹤</a>
        <a href="TripsZh.dc.html" style="color: #C9D1D9; text-decoration: none; padding: 10px 14px; border-radius: 8px">我的旅程</a>
        <a href="#" style="color: #C9D1D9; text-decoration: none; padding: 10px 14px; border-radius: 8px">通知紀錄</a>
        <a href="#" style="color: #C9D1D9; text-decoration: none; padding: 10px 14px; border-radius: 8px">設定</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px">
    <a href="MainZh.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 500; padding: 8px 0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      取消
    </a>
    <h1 style="margin: 0; font-size: 32px; line-height: 1.2">新增追蹤</h1>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <form style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE1DC; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 26px">

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
          <legend style="font-size: 18px; font-weight: 700; padding: 0; margin-bottom: 12px">行程</legend>
          <div role="group" aria-label="行程類型" style="display: inline-flex; align-self: flex-start; background: #EEF0EC; border-radius: 10px; padding: 4px; gap: 4px">
            <sc-for list="{{ trips }}" as="t" hint-placeholder-count="2">
              <button type="button" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="from" style="font-size: 14px; font-weight: 500">出發地</label>
              <input id="from" type="text" defaultValue="SFO · 舊金山" style="font: inherit; padding: 11px 12px; border: 1px solid #C4CAC4; border-radius: 8px">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="to" style="font-size: 14px; font-weight: 500">目的地</label>
              <input id="to" type="text" defaultValue="TPE · 台北桃園" style="font: inherit; padding: 11px 12px; border: 1px solid #C4CAC4; border-radius: 8px">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="depart" style="font-size: 14px; font-weight: 500">去程日期</label>
              <input id="depart" type="date" defaultValue="2026-12-18" style="font: inherit; padding: 10px 12px; border: 1px solid #C4CAC4; border-radius: 8px">
            </div>
            <sc-if value="{{ isRound }}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="return" style="font-size: 14px; font-weight: 500">回程日期</label>
                <input id="return" type="date" defaultValue="2027-01-03" style="font: inherit; padding: 10px 12px; border: 1px solid #C4CAC4; border-radius: 8px">
              </div>
            </sc-if>
          </div>
        </fieldset>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-size: 18px; font-weight: 700; padding: 0; margin-bottom: 4px">日期可以彈性調整嗎？</legend>
          <p style="margin: 0; color: #4F5B66; font-size: 14px">我們也會查詢同樣天數、提早或延後出發的票價，並排比較。</p>
          <div role="group" aria-label="日期範圍" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{ windows }}" as="w" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{ w.pressed }}" onClick="{{ w.pick }}" style="{{ w.style }}">
                <span style="display: block; font-size: 18px; font-weight: 700">{{ w.label }}</span>
                <span style="display: block; font-size: 13px; font-weight: 400; margin-top: 2px">{{ w.sub }}</span>
              </button>
            </sc-for>
          </div>
        </fieldset>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-size: 18px; font-weight: 700; padding: 0; margin-bottom: 4px">航空公司</legend>
          <div role="group" aria-label="航空公司偏好" style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{ alliances }}" as="a" hint-placeholder-count="5">
              <button type="button" aria-pressed="{{ a.pressed }}" onClick="{{ a.pick }}" style="{{ a.style }}">{{ a.label }}</button>
            </sc-for>
          </div>
          <sc-if value="{{ isSpecific }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
              <label for="airlines" style="font-size: 14px; font-weight: 500">航空公司代碼</label>
              <input id="airlines" type="text" placeholder="例如 BR, CI, UA" style="font: inherit; padding: 11px 12px; border: 1px solid #C4CAC4; border-radius: 8px">
            </div>
          </sc-if>
        </fieldset>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-size: 18px; font-weight: 700; padding: 0; margin-bottom: 4px">其他條件</legend>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="cabin" style="font-size: 14px; font-weight: 500">艙等</label>
              <select id="cabin" defaultValue="economy" style="font: inherit; padding: 10px 12px; border: 1px solid #C4CAC4; border-radius: 8px; background: #FFFFFF">
                <option value="economy">經濟艙</option>
                <option value="premium">豪華經濟艙</option>
                <option value="business">商務艙</option>
                <option value="first">頭等艙</option>
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="pax" style="font-size: 14px; font-weight: 500">成人人數</label>
              <input id="pax" type="number" min="1" max="9" defaultValue="1" style="font: inherit; padding: 10px 12px; border: 1px solid #C4CAC4; border-radius: 8px">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="stops" style="font-size: 14px; font-weight: 500">轉機</label>
              <select id="stops" defaultValue="1" style="font: inherit; padding: 10px 12px; border: 1px solid #C4CAC4; border-radius: 8px; background: #FFFFFF">
                <option value="any">不限</option>
                <option value="0">只要直飛</option>
                <option value="1">最多轉機 1 次</option>
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="currency" style="font-size: 14px; font-weight: 500">幣別</label>
              <select id="currency" defaultValue="USD" onChange="{{ pickCurrency }}" style="font: inherit; padding: 10px 12px; border: 1px solid #C4CAC4; border-radius: 8px; background: #FFFFFF">
                <sc-for list="{{ currencies }}" as="c" hint-placeholder-count="10">
                  <option value="{{ c.code }}">{{ c.label }}</option>
                </sc-for>
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="freq" style="font-size: 14px; font-weight: 500">你的日期查價頻率</label>
              <select id="freq" defaultValue="12" onChange="{{ pickFreq }}" style="font: inherit; padding: 10px 12px; border: 1px solid #C4CAC4; border-radius: 8px; background: #FFFFFF">
                <option value="6">每 6 小時</option>
                <option value="12">每 12 小時（預設）</option>
                <option value="24">每 24 小時</option>
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="target" style="font-size: 14px; font-weight: 500">低於此價格就通知（選填）</label>
              <div style="display: flex; align-items: center; border: 1px solid #C4CAC4; border-radius: 8px; overflow: hidden">
                <span style="padding: 10px 12px; background: #EEF0EC; font-family: 'IBM Plex Mono', monospace">{{ curSymbol }}</span>
                <input id="target" type="number" defaultValue="800" style="flex: 1; min-width: 0; border: 0; padding: 10px 12px; font: inherit">
              </div>
            </div>
          </div>
        </fieldset>

        <div style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 6px; border-top: 1px solid #EEF0EC">
          <a href="WatchDetailZh.dc.html" style="margin-top: 14px; background: #14202B; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 700">開始追蹤</a>
          <a href="MainZh.dc.html" style="margin-top: 14px; color: #14202B; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; border: 1px solid #C4CAC4">取消</a>
        </div>
      </form>

      <aside aria-labelledby="sum-h" style="flex: 1 1 280px; background: #14202B; color: #F3F4F1; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
        <h2 id="sum-h" style="margin: 0; font-size: 18px">追蹤內容</h2>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; line-height: 1.2">{{ routeLabel }}</div>
        <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px">
          <dt style="color: #AEB8C2">日期</dt><dd style="margin: 0">{{ datesLabel }}</dd>
          <dt style="color: #AEB8C2">範圍</dt><dd style="margin: 0">{{ windowLabel }}</dd>
          <dt style="color: #AEB8C2">航空</dt><dd style="margin: 0">{{ allianceLabel }}</dd>
          <dt style="color: #AEB8C2">艙等</dt><dd style="margin: 0">經濟艙 · 1 位成人 · 最多轉機 1 次</dd>
          <dt style="color: #AEB8C2">幣別</dt><dd style="margin: 0">{{ currencyLabel }}</dd>
        </dl>
        <div style="border-top: 1px solid #33465A; padding-top: 14px; display: flex; flex-direction: column; gap: 4px">
          <div style="color: #AEB8C2; font-size: 13px">每月查價次數（估計）</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600">{{ checks }}</div>
          <div style="color: #C9D1D9; font-size: 13px">{{ freqNote }}</div>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { trip: 'round', win: 7, alliance: 'star', currency: 'USD', freq: 12 };
  }
  seg(on) {
    return 'font: inherit; font-size: 14px; font-weight: 600; min-height: 40px; padding: 8px 16px; border-radius: 8px; border: 0; cursor: pointer; background: ' + (on ? '#14202B' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#3D4650');
  }
  renderVals() {
    var self = this, s = this.state;
    var trips = [['round', '來回'], ['oneway', '單程']].map(function (t) {
      return { label: t[1], pressed: s.trip === t[0] ? 'true' : 'false', style: self.seg(s.trip === t[0]), pick: function () { self.setState({ trip: t[0] }); } };
    });
    var windows = [[0, '精確日期', '查 1 個日期'], [3, '前後 3 天', '查 7 個日期'], [7, '前後 7 天', '查 15 個日期']].map(function (w) {
      var on = s.win === w[0];
      return {
        label: w[1], sub: w[2], pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ win: w[0] }); },
        style: 'font: inherit; text-align: left; min-height: 64px; padding: 12px 14px; border-radius: 10px; cursor: pointer; border: 2px solid ' + (on ? '#14202B' : '#DDE1DC') + '; background: ' + (on ? '#F3F4F1' : '#FFFFFF') + '; color: #14202B'
      };
    });
    var allianceList = [['any', '不限航空'], ['star', '星空聯盟'], ['oneworld', '寰宇一家'], ['skyteam', '天合聯盟'], ['specific', '指定航空公司']];
    var alliances = allianceList.map(function (a) {
      var on = s.alliance === a[0];
      return {
        label: a[1], pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ alliance: a[0] }); },
        style: 'font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 8px 16px; border-radius: 999px; cursor: pointer; border: 1px solid ' + (on ? '#14202B' : '#C4CAC4') + '; background: ' + (on ? '#14202B' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#14202B')
      };
    });
    var currencyList = [
      ['USD', 'US$', '美元'], ['TWD', 'NT$', '新台幣'], ['JPY', '¥', '日圓'], ['EUR', '€', '歐元'],
      ['GBP', '£', '英鎊'], ['HKD', 'HK$', '港幣'], ['SGD', 'S$', '新加坡幣'],
      ['CAD', 'CA$', '加幣'], ['AUD', 'A$', '澳幣'], ['KRW', '₩', '韓元']
    ];
    var cur = currencyList.filter(function (c) { return c[0] === s.currency; })[0];
    var dates = s.win * 2 + 1;
    var checks = (24 / s.freq) * 30 + (dates - 1) * 30;
    var allianceLabel = allianceList.filter(function (a) { return a[0] === s.alliance; })[0][1];
    return {
      currencies: currencyList.map(function (c) { return { code: c[0], label: c[2] + '（' + c[0] + '）' }; }),
      pickCurrency: function (e) { self.setState({ currency: e.target.value }); },
      pickFreq: function (e) { self.setState({ freq: parseInt(e.target.value, 10) }); },
      curSymbol: cur[1],
      currencyLabel: cur[2] + '（' + cur[1] + '）',
      freqNote: (s.win === 0 ? '你的日期每 ' + s.freq + ' 小時查一次。' : '你的日期每 ' + s.freq + ' 小時查一次，鄰近日期每天一次。') + '離出發日還很遠時會降低查價頻率。',
      trips: trips, windows: windows, alliances: alliances,
      isRound: s.trip === 'round',
      isSpecific: s.alliance === 'specific',
      routeLabel: s.trip === 'round' ? 'SFO ⇄ TPE' : 'SFO → TPE',
      datesLabel: s.trip === 'round' ? '12月18日 → 1月3日（16 晚）' : '12月18日',
      windowLabel: s.win === 0 ? '只查精確日期' : '前後 ' + s.win + ' 天 · ' + dates + ' 個日期',
      allianceLabel: allianceLabel,
      checks: '約 ' + checks + ' 次'
    };
  }
}
</script>
</body>
</html>
